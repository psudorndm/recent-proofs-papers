name: refresh papers

on:
  schedule:
    # once a day at 06:17 UTC (IACR ePrint asks harvesters not to refresh more than daily)
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Re-harvest the full history (slow; use after changing the keyword lists)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest papers
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python3 scraper/scrape.py --full
          else
            # merge the last 30 days into the stored history
            python3 scraper/scrape.py --days 30
          fi

      - name: Commit refreshed data
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: refresh papers ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
