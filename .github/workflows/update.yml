name: refresh papers

on:
  schedule:
    # once a day at 06:17 UTC (IACR ePrint asks harvesters not to refresh more than daily)
    - cron: "17 6 * * *"
  push:
    # an edited taxonomy re-tags the stored papers right away (no harvesting)
    branches: [main]
    paths: [taxonomy.toml]
  workflow_dispatch:
    inputs:
      full:
        description: "Re-harvest the full history (slow; needed after adding a new top-level topic)"
        type: boolean
        default: false
      allow_drop:
        description: "Allow a taxonomy change to drop more than 20% of the stored papers"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-papers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest and tag papers
        run: |
          flags=""
          if [ "${{ inputs.allow_drop }}" = "true" ]; then flags="--allow-drop"; fi
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 scraper/scrape.py --no-fetch $flags
          elif [ "${{ inputs.full }}" = "true" ]; then
            python3 scraper/scrape.py --full $flags
          else
            # merge the last 30 days into the stored history
            python3 scraper/scrape.py --days 30 $flags
          fi

      - name: Commit refreshed data
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
          else
            if [ "${{ github.event_name }}" = "push" ]; then
              git commit -m "chore: re-tag papers after taxonomy change"
            else
              git commit -m "chore: refresh papers ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            fi
            git pull --rebase
            git push
          fi
