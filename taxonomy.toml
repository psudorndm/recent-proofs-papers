# Security proofs
# ---------------------------------------------------------------------------

[topics.security]
label = "security proofs"
keywords = [
    'security proofs?',
    'proofs? of security',
    'provabl[ey] secur',
    'provable security',
    'security reductions?',
    'tight(ly)?[- ]secure',
    'tight (security|reductions?)',
    'random[- ]oracle model',
    'quantum random[- ]oracle',
    'universal(ly)? composab',
    'simulation[- ]based security',
    'game[- ]based (security|proofs?)',
    'standard model',
    'generic group model',
    'algebraic group model',
    'computational soundness',
    'security (model|definitions?|notions?) for',
    'formal security analysis',
]
case_sensitive = [
    '\bIND-(CCA2?|CPA)\b',
    '\b(s?EUF|SUF)-CMA\b',
    '\bQROM\b',
    '\bUC[- ]secure\b',
]
arxiv_terms = [
    "security proof", "provably secure", "provable security", "security reduction",
    "random oracle model", "universal composability", "simulation-based security",
]

# ---------------------------------------------------------------------------
# Formal verification (of cryptography only, hence the requires_* lists)
# ---------------------------------------------------------------------------

