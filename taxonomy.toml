    'mechani[sz]ed (security )?(proofs?|verification)',
    'machine[- ]checked',
    'proof assistants?',
    'verified implementations?',
    'verified compil',
    'symbolic (protocol )?(analysis|model|verification|security)',
    'dolev[- ]yao',
    'computationally sound',
    'formal (analysis|methods?)',
]
case_sensitive = [
    '\bTamarin\b',
    '\bProVerif\b',
    '\bCryptoVerif\b',
    '\bEasyCrypt\b',
    '\bCoq\b',
    '\bRocq\b',
    '\bIsabelle\b',
    '\bSSProve\b',
    '\bSquirrel\b',
    '\bDeepSec\b',
    '\bJasmin\b',
    '\bHACL\*',
    '\bF\*',
    '\bLean 4\b',
]
requires_keywords = [
    'crypt',
    'protocols?',
    'secur',
    'authenticat',
    'signatures?',
    'encrypt',
    'key (exchange|agreement|encapsulation)',
    'zero[- ]?knowledge',
]
requires_case_sensitive = [
    '\b(TLS|SSH|QUIC|IPsec|WireGuard|Kerberos|MLS|EMV)\b',
]
arxiv_terms = [
    "formal verification", "mechanized proof", "verified implementation",
    "symbolic analysis", "Tamarin", "ProVerif", "CryptoVerif", "EasyCrypt",
]

# ---------------------------------------------------------------------------
# Post-quantum: tags papers already in the archive (tag_only), so post-quantum
# work without a proof / security-proof / verification angle is not added.
# ---------------------------------------------------------------------------

[topics.post-quantum]
label = "post-quantum"
tag_only = true
keywords = [
    'post[- ]quantum',
    'quantum[- ](resistant|resistance|safe|secure|security)',
    'quantum random[- ]oracle',
    'lattice[- ]based',
    'learning with errors',
    'short integer solution',
    'isogen(y|ies)[- ]based|isogenies',
    'hash[- ]based signatures?',
    'code[- ]based (cryptography|encryption|signatures?|kems?)',
    'multivariate (cryptography|signatures?|quadratic)',
    'quantum adversar',
]
case_sensitive = [
    '\bPQC?\b',
    '\bQROM\b',
    '\b(ML-KEM|ML-DSA|SLH-DSA|FN-DSA|HQC)\b',
    '\b(CRYSTALS-)?(Kyber|Dilithium)\b',
    '\b(Falcon|SPHINCS\+?|XMSS|LMS|NTRU|FrodoKEM|SQIsign|CSIDH|SIDH|SIKE|McEliece|MAYO|UOV)\b',
    '\b(M-?|R-?)?(LWE|SIS)\b',
]

